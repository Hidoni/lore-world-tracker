# Weekly, grouped dependency updates (one PR per ecosystem). Dependabot PRs go through the same CI
# gate; they are not issues, so a human or agent reviews and merges them when green.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # typescript-eslint 8.72 requires typescript <6.1. Unblocked by the first typescript-eslint
      # release whose peer range allows TypeScript 7 (#384).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
