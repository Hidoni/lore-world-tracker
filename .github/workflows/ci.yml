# PR gate (testing.md §5, workflow.md §7). Every job is required: agents self-merge only when all
# of them are green (D15). Each job runs the same make target as local development.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One run per branch/PR; a new push cancels the superseded PR run (main runs always finish).
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # `uv run` must never re-lock in CI: a stale uv.lock fails instead of silently updating.
  UV_FROZEN: '1'
  FORCE_COLOR: '1'

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --directory backend
      - run: make check-backend

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make check-frontend

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --frozen --directory backend
      - run: npm ci
      # OpenAPI → schema.gen.ts drift. `lore db check` joins with #31.
      - run: make check-contract

  chronology:
    name: chronology
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # More property-test examples (hypothesis `ci` profile, fast-check numRuns), seeded.
      PROPERTY_PROFILE: ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the change detection below diffs against the base commit
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --frozen --directory backend
      - run: npm ci
      # JSON Schema export + TS type drift, then both engines' tests and conformance runners.
      - run: make check-chronology
      - run: make test-chronology
      # Differential fuzzing of the two engines (testing.md §6) when chronology code or vectors
      # change; nightly.yml runs 10,000 new random cases every night.
      - name: Detect chronology changes
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths=(spec/chronology backend/src/lore/chronology backend/tests/chronology packages/chronology)
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || ! git diff --quiet "$BASE" HEAD -- "${paths[@]}"; then
            echo "chronology=true" >> "$GITHUB_OUTPUT"
          else
            echo "chronology=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Differential tests
        if: steps.changes.outputs.chronology == 'true'
        env:
          DIFFERENTIAL_CASES: '1000'
        run: make test-differential

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --frozen --directory backend
      - run: npm ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx -w frontend playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx -w frontend playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx -w frontend playwright install-deps chromium
      - run: make e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: make docker
      # Compose up → /api/v1/health → / serves the SPA, non-root, ./data bind mount writable.
      - run: make docker-smoke
