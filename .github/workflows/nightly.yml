# Nightly runs (testing.md §5): checks too slow or too noisy for every PR. Not a merge gate.
# Run it by hand from the Actions tab (workflow_dispatch).
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: '1'
  FORCE_COLOR: '1'

jobs:
  chronology:
    name: chronology (differential, benchmarks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: uv sync --frozen --directory backend
      - run: npm ci
      # 10,000 new random cases every night (testing.md §6). A failure prints the case as a
      # ready-made conformance vector and the hypothesis blob to reproduce it.
      - name: Differential tests
        env:
          DIFFERENTIAL_CASES: '10000'
          DIFFERENTIAL_RANDOM: '1'
        run: make test-differential
      # Both engines' perf budgets (testing.md §4.1).
      - run: make bench
